name: Update GitHub Profile README Assets

on:
  schedule:
    # Run every midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Fetch Contributions & Generate SVGs
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/prep_photo.py
          python scripts/make_ascii_svg.py
          python scripts/make_info_card.py
          python scripts/generate_projects_svg.py
          python scripts/generate_boot_svg.py
          python scripts/generate_skill_svg.py

      - name: 🚀 Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/
          if git diff --staged --quiet; then
            echo "No changes in generated SVG assets."
          else
            git commit -m "chore(auto): update profile SVGs and contribution stats [skip ci]"
            git push
          fi
