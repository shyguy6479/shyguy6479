<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 490" width="100%" height="490">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');

      .card-bg { fill: #0A0F1F; stroke: #00E5FF; stroke-width: 1.5; stroke-opacity: 0.5; }
      .title-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5EEAFF; font-weight: bold; }
      
      .info-row {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11.5px;
        opacity: 0;
        animation: slideFade 0.4s ease-out forwards;
      }

      .key { fill: #00E5FF; font-weight: bold; }
      .val { fill: #FFFFFF; }
      .val-accent { fill: #00FFB3; font-weight: bold; }
      .badge { fill: #1E293B; stroke: #00C8FF; stroke-width: 0.8; rx: 3px; ry: 3px; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #5EEAFF; }

      .meter-bg { fill: #0F172A; rx: 3px; }
      .meter-fill-cpu { fill: url(#cpuGrad); rx: 3px; width: 0; animation: fillCpu 2s cubic-bezier(0.1, 0.8, 0.2, 1) 0.8s forwards; }
      .meter-fill-ram { fill: url(#ramGrad); rx: 3px; width: 0; animation: fillRam 2s cubic-bezier(0.1, 0.8, 0.2, 1) 1.1s forwards; }

      #row1  { animation-delay: 0.2s; }
      #row2  { animation-delay: 0.4s; }
      #row3  { animation-delay: 0.6s; }
      #row4  { animation-delay: 0.8s; }
      #row5  { animation-delay: 1.0s; }
      #row6  { animation-delay: 1.2s; }
      #row7  { animation-delay: 1.4s; }
      #row8  { animation-delay: 1.6s; }
      #row9  { animation-delay: 1.8s; }
      #row10 { animation-delay: 2.0s; }
      #row11 { animation-delay: 2.2s; }

      @keyframes slideFade {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes fillCpu {
        0% { width: 0px; }
        100% { width: 145px; }
      }

      @keyframes fillRam {
        0% { width: 0px; }
        100% { width: 175px; }
      }

      .scanline {
        fill: url(#infoScanline);
        opacity: 0.12;
        pointer-events: none;
      }
    </style>

    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFB3"/>
    </linearGradient>

    <pattern id="infoScanline" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.3" />
    </pattern>

    <filter id="infoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="407" height="482" rx="10" ry="10" class="card-bg" filter="url(#infoGlow)"/>

  <!-- Header -->
  <path d="M 4 14 Q 4 4 14 4 L 401 4 Q 411 4 411 14 L 411 36 L 4 36 Z" fill="#050816"/>
  <line x1="4" y1="36" x2="411" y2="36" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>

  <circle cx="20" cy="20" r="4.5" fill="#FF5F56"/>
  <circle cx="34" cy="20" r="4.5" fill="#FFBD2E"/>
  <circle cx="48" cy="20" r="4.5" fill="#27C93F"/>

  <text x="207" y="24" text-anchor="middle" class="title-text">shyguy6479@AI-OS:~ // NEOFETCH_SPEC</text>

  <!-- Neofetch Info Rows -->
  <g transform="translate(24, 60)">
    <!-- User Info Header -->
    <g id="row1" class="info-row" transform="translate(0, 0)">
      <text class="val-accent" font-size="14">shyguy6479</text>
      <text x="95" class="key">@</text>
      <text x="110" class="val" font-weight="bold">AI-OPERATING-SYSTEM</text>
      <line x1="0" y1="8" x2="365" y2="8" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
    </g>

    <!-- Role -->
    <g id="row2" class="info-row" transform="translate(0, 32)">
      <text class="key">OS_ROLE</text>
      <text x="95" class="val">::</text>
      <text x="115" class="val-accent">AI Engineer</text>
      <text x="205" class="val">|</text>
      <text x="220" class="val">Backend Dev</text>
    </g>
    <g id="row3" class="info-row" transform="translate(0, 52)">
      <text class="key">FOCUS</text>
      <text x="95" class="val">::</text>
      <text x="115" class="val">AI/ML Student &amp; Agentic Systems</text>
    </g>

    <!-- System Meters -->
    <g id="row4" class="info-row" transform="translate(0, 85)">
      <text class="key">NEURAL_CPU</text>
      <text x="95" class="val">::</text>
      <rect x="115" y="-10" width="200" height="12" class="meter-bg"/>
      <rect x="115" y="-10" height="12" class="meter-fill-cpu"/>
      <text x="325" class="val" font-size="10">72%</text>
    </g>
    <g id="row5" class="info-row" transform="translate(0, 107)">
      <text class="key">VRAM_LOAD</text>
      <text x="95" class="val">::</text>
      <rect x="115" y="-10" width="200" height="12" class="meter-bg"/>
      <rect x="115" y="-10" height="12" class="meter-fill-ram"/>
      <text x="325" class="val" font-size="10">88%</text>
    </g>

    <!-- Stack Badges Header -->
    <g id="row6" class="info-row" transform="translate(0, 142)">
      <text class="key">CORE_STACK</text>
      <text x="95" class="val">::</text>
    </g>
    <!-- Stack Chips -->
    <g id="row7" class="info-row" transform="translate(0, 168)">
      <!-- Python -->
      <rect x="0" y="-12" width="60" height="18" class="badge"/>
      <text x="30" y="0" text-anchor="middle" class="badge-text">Python</text>
      <!-- FastAPI -->
      <rect x="68" y="-12" width="65" height="18" class="badge"/>
      <text x="100" y="0" text-anchor="middle" class="badge-text">FastAPI</text>
      <!-- React -->
      <rect x="141" y="-12" width="55" height="18" class="badge"/>
      <text x="168" y="0" text-anchor="middle" class="badge-text">React</text>
      <!-- TensorFlow -->
      <rect x="204" y="-12" width="80" height="18" class="badge"/>
      <text x="244" y="0" text-anchor="middle" class="badge-text">TensorFlow</text>
      <!-- PyTorch -->
      <rect x="292" y="-12" width="68" height="18" class="badge"/>
      <text x="326" y="0" text-anchor="middle" class="badge-text">PyTorch</text>
    </g>
    <g id="row8" class="info-row" transform="translate(0, 194)">
      <!-- OpenCV -->
      <rect x="0" y="-12" width="65" height="18" class="badge"/>
      <text x="32" y="0" text-anchor="middle" class="badge-text">OpenCV</text>
      <!-- Firebase -->
      <rect x="73" y="-12" width="70" height="18" class="badge"/>
      <text x="108" y="0" text-anchor="middle" class="badge-text">Firebase</text>
      <!-- Supabase -->
      <rect x="151" y="-12" width="75" height="18" class="badge"/>
      <text x="188" y="0" text-anchor="middle" class="badge-text">Supabase</text>
      <!-- Docker -->
      <rect x="234" y="-12" width="60" height="18" class="badge"/>
      <text x="264" y="0" text-anchor="middle" class="badge-text">Docker</text>
    </g>

    <!-- Learning -->
    <g id="row9" class="info-row" transform="translate(0, 235)">
      <text class="key">LEARNING</text>
      <text x="95" class="val">::</text>
      <text x="115" class="val-accent">Deep Learning</text>
      <text x="215" class="val">•</text>
      <text x="230" class="val">LLMs &amp; Agents</text>
    </g>

    <!-- Active Projects Header -->
    <g id="row10" class="info-row" transform="translate(0, 275)">
      <text class="key">PROJECTS</text>
      <text x="95" class="val">::</text>
      <text x="115" class="val">🤖 AVO AI</text>
      <text x="210" class="val">🏥 Medical AI</text>
    </g>
    <g id="row11" class="info-row" transform="translate(0, 298)">
      <text class="key">DEPLOYED</text>
      <text x="95" class="val">::</text>
      <text x="115" class="val">🧠 Code Analyzer</text>
      <text x="235" class="val">🎥 AI Video Editor</text>
    </g>
  </g>

  <!-- Footer status -->
  <g transform="translate(24, 470)">
    <text font-family="'JetBrains Mono', monospace" font-size="10" fill="#5EEAFF">SYS_STATUS :: <tspan fill="#00FFB3" font-weight="bold">ONLINE (0 ERRORS)</tspan></text>
  </g>

  <!-- Scanline -->
  <rect x="4" y="4" width="407" height="482" rx="10" ry="10" class="scanline"/>
</svg>