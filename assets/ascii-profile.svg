<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 510" width="100%" height="510">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .card-bg { fill: #0A0F1F; stroke: #00E5FF; stroke-width: 1.5; stroke-opacity: 0.5; }
      .header-bg { fill: #050816; stroke: #00E5FF; stroke-width: 1; stroke-opacity: 0.3; }
      .title-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #5EEAFF; font-weight: bold; }

      .ascii-line {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11.5px;
        fill: #E2E8F0;
        white-space: pre;
        opacity: 0;
        animation: lineReveal 0.15s ease-out forwards;
      }

      .cursor {
        fill: #00E5FF;
        animation: blink 0.8s infinite alternate;
      }

      @keyframes lineReveal {
        0% { opacity: 0; transform: translateX(-4px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes blink {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      .scanline {
        fill: url(#asciiScanline);
        opacity: 0.15;
        pointer-events: none;
      }
    </style>

    <pattern id="asciiScanline" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.3" />
    </pattern>

    <filter id="asciiGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="4" y="4" width="407" height="502" rx="10" ry="10" class="card-bg" filter="url(#asciiGlow)"/>

  <!-- Header -->
  <path d="M 4 14 Q 4 4 14 4 L 401 4 Q 411 4 411 14 L 411 36 L 4 36 Z" fill="#050816"/>
  <line x1="4" y1="36" x2="411" y2="36" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
  
  <circle cx="20" cy="20" r="4.5" fill="#FF5F56"/>
  <circle cx="34" cy="20" r="4.5" fill="#FFBD2E"/>
  <circle cx="48" cy="20" r="4.5" fill="#27C93F"/>

  <text x="207" y="24" text-anchor="middle" class="title-text">shyguy6479@AI-OS:~ // ASCII_PORTRAIT</text>

