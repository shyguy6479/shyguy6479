<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');

      .card-bg { fill: #0A0F1F; stroke: #00E5FF; stroke-width: 1.5; stroke-opacity: 0.5; }
      .title-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #5EEAFF; font-weight: bold; }

      .skill-name { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .skill-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #00FFB3; font-weight: bold; }

      .bar-bg { fill: #050816; stroke: #00E5FF; stroke-opacity: 0.25; stroke-width: 0.8; }
      .bar-fill {
        fill: url(#skillGrad);
        width: 0px;
      }

      
      @keyframes fillSkill0 {
        0% { width: 0px; }
        100% { width: 513px; }
      }
      #skill-bar-0 {
        animation: fillSkill0 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) 0.3s forwards;
      }

      @keyframes fillSkill1 {
        0% { width: 0px; }
        100% { width: 486px; }
      }
      #skill-bar-1 {
        animation: fillSkill1 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) 0.5s forwards;
      }

      @keyframes fillSkill2 {
        0% { width: 0px; }
        100% { width: 459px; }
      }
      #skill-bar-2 {
        animation: fillSkill2 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) 0.7s forwards;
      }

      @keyframes fillSkill3 {
        0% { width: 0px; }
        100% { width: 486px; }
      }
      #skill-bar-3 {
        animation: fillSkill3 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) 0.9s forwards;
      }

      @keyframes fillSkill4 {
        0% { width: 0px; }
        100% { width: 432px; }
      }
      #skill-bar-4 {
        animation: fillSkill4 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) 1.1s forwards;
      }

      @keyframes fillSkill5 {
        0% { width: 0px; }
        100% { width: 405px; }
      }
      #skill-bar-5 {
        animation: fillSkill5 1.8s cubic-bezier(0.1, 0.8, 0.2, 1) 1.3s forwards;
      }

      .scanline {
        fill: url(#skillScanline);
        opacity: 0.12;
        pointer-events: none;
      }
    </style>

    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FFB3"/>
    </linearGradient>

    <pattern id="skillScanline" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.3" />
    </pattern>

    <filter id="skillGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="842" height="352" rx="10" ry="10" class="card-bg" filter="url(#skillGlow)"/>

  <!-- Header Bar -->
  <path d="M 4 14 Q 4 4 14 4 L 836 4 Q 846 4 846 14 L 846 40 L 4 40 Z" fill="#050816"/>
  <line x1="4" y1="40" x2="846" y2="40" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>

  <circle cx="20" cy="22" r="4.5" fill="#FF5F56"/>
  <circle cx="34" cy="22" r="4.5" fill="#FFBD2E"/>
  <circle cx="48" cy="22" r="4.5" fill="#27C93F"/>

  <text x="425" y="26" text-anchor="middle" class="title-text">shyguy6479@AI-OS:~ // TECHNICAL_SKILLS_MATRIX</text>

  <!-- Skill Rows -->
  
    <g transform="translate(30, 75)">
      <text x="0" y="16" class="skill-name">🐍 Python</text>
      <!-- Background Bar -->
      <rect x="200" y="2" width="540" height="18" rx="4" class="bar-bg"/>
      <!-- Animated Fill Bar -->
      <rect id="skill-bar-0" x="200" y="2" height="18" rx="4" class="bar-fill"/>
      <!-- Percentage Text -->
      <text x="755" y="16" class="skill-val">95%</text>
    </g>

    <g transform="translate(30, 117)">
      <text x="0" y="16" class="skill-name">⚡ FastAPI</text>
      <!-- Background Bar -->
      <rect x="200" y="2" width="540" height="18" rx="4" class="bar-bg"/>
      <!-- Animated Fill Bar -->
      <rect id="skill-bar-1" x="200" y="2" height="18" rx="4" class="bar-fill"/>
      <!-- Percentage Text -->
      <text x="755" y="16" class="skill-val">90%</text>
    </g>

    <g transform="translate(30, 159)">
      <text x="0" y="16" class="skill-name">⚛️ React</text>
      <!-- Background Bar -->
      <rect x="200" y="2" width="540" height="18" rx="4" class="bar-bg"/>
      <!-- Animated Fill Bar -->
      <rect id="skill-bar-2" x="200" y="2" height="18" rx="4" class="bar-fill"/>
      <!-- Percentage Text -->
      <text x="755" y="16" class="skill-val">85%</text>
    </g>

    <g transform="translate(30, 201)">
      <text x="0" y="16" class="skill-name">🤖 Machine Learning</text>
      <!-- Background Bar -->
      <rect x="200" y="2" width="540" height="18" rx="4" class="bar-bg"/>
      <!-- Animated Fill Bar -->
      <rect id="skill-bar-3" x="200" y="2" height="18" rx="4" class="bar-fill"/>
      <!-- Percentage Text -->
      <text x="755" y="16" class="skill-val">90%</text>
    </g>

    <g transform="translate(30, 243)">
      <text x="0" y="16" class="skill-name">🧠 Deep Learning</text>
      <!-- Background Bar -->
      <rect x="200" y="2" width="540" height="18" rx="4" class="bar-bg"/>
      <!-- Animated Fill Bar -->
      <rect id="skill-bar-4" x="200" y="2" height="18" rx="4" class="bar-fill"/>
      <!-- Percentage Text -->
      <text x="755" y="16" class="skill-val">80%</text>
    </g>

    <g transform="translate(30, 285)">
      <text x="0" y="16" class="skill-name">🔮 LLMs & AI Agents</text>
      <!-- Background Bar -->
      <rect x="200" y="2" width="540" height="18" rx="4" class="bar-bg"/>
      <!-- Animated Fill Bar -->
      <rect id="skill-bar-5" x="200" y="2" height="18" rx="4" class="bar-fill"/>
      <!-- Percentage Text -->
      <text x="755" y="16" class="skill-val">75%</text>
    </g>

  <!-- Scanline Overlay -->
  <rect x="4" y="4" width="842" height="352" rx="10" ry="10" class="scanline"/>
</svg>